name: Refresh storm archive
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 11 * *'
  push:
    branches: [main]
    paths: ['scripts/refresh.py', '.github/workflows/refresh.yml']
permissions:
  contents: read
concurrency:
  group: refresh-storm-archive
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/refresh.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/build.py
      - name: Publish validated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh the Canadian storm archive'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
